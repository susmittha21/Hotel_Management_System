<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | VS Plaza PMS</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #edf2f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 4px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }

    .login-header {
      background: #2c5282;
      color: #ffffff;
      padding: 20px;
      text-align: center;
    }

    .login-logo {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .login-header h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .login-header p {
      font-size: 11px;
      color: #bee3f8;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .login-body {
      padding: 20px;
    }

    .quick-creds-box {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #4a5568;
    }

    .quick-creds-box strong {
      color: #1a202c;
    }

    .quick-fill-btn {
      margin-top: 4px;
      background: #e2e8f0;
      border: none;
      padding: 3px 8px;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: #1a202c;
    }

    .quick-fill-btn:hover {
      background: #cbd5e0;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">VS</div>
      <h2>VS Plaza</h2>
      <p>Property Management System</p>
    </div>

    <div class="login-body">
      <div class="quick-creds-box">
        <div><strong>Demo Credentials:</strong></div>
        <div style="margin-top: 2px;">Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>admin123</code></div>
        <button type="button" class="quick-fill-btn" onclick="fillDemoCredentials()">Auto-Fill</button>
      </div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group" style="margin-bottom: 12px;">
          <label class="form-label" for="userRole">Role</label>
          <select id="userRole" class="form-control" required>
            <option value="Front Desk Receptionist" selected>Front Desk Receptionist</option>
            <option value="Hotel Manager">Hotel Manager</option>
            <option value="Night Auditor">Night Auditor</option>
            <option value="Housekeeping Supervisor">Housekeeping Supervisor</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 12px;">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Staff ID or username" required value="admin">
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required value="admin123">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 8px;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 14px;">
        <a href="index.html" style="font-size: 11px; color: #718096;">&larr; Back to Hotel Website</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function fillDemoCredentials() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
      document.getElementById('userRole').value = 'Front Desk Receptionist';
      showToast('Credentials filled', 'info');
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const role = document.getElementById('userRole').value;
      const username = document.getElementById('username').value.trim();

      HotelStore.setAuth({
        loggedIn: true,
        user: username,
        role: role,
        loginTime: new Date().toISOString()
      });

      showToast('Login successful', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 300);
    }
  </script>
</body>
</html>
