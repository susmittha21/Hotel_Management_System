<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Management &amp; Floor Matrix | VS PLAZA PMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="pms-layout">
    <!-- Sidebar Navigation -->
    <aside class="pms-sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">VS</div>
        <div class="brand-text">
          <h2>VS PLAZA</h2>
          <span>Property Management</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Front Office</div>
        <a href="dashboard.html" class="nav-item">
          <span class="icon">&#9632;</span>
          <span>Dashboard</span>
        </a>
        <a href="rooms.html" class="nav-item active">
          <span class="icon">&#9632;</span>
          <span>Room Status</span>
        </a>
        <a href="bookings.html" class="nav-item">
          <span class="icon">&#9632;</span>
          <span>Reservations</span>
        </a>
        <a href="guests.html" class="nav-item">
          <span class="icon">&#9632;</span>
          <span>Guest Directory</span>
        </a>

      </nav>

      <div class="sidebar-footer">
        <div class="shift-info">
          <div class="user-avatar">FD</div>
          <div class="user-meta">
            <div class="user-name">Front Desk</div>
            <div class="user-role">Morning Shift</div>
          </div>
        </div>
        <button class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="pms-main">
      <header class="pms-topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
          <div class="page-headline">
            <h1>Room Management &amp; Status</h1>
            <p>Live inventory matrix, occupancy tracking &amp; tariff controls</p>
          </div>
        </div>

        <div class="topbar-right">
          <button class="btn-quick-action" onclick="openModal('addRoomModal')">
            + Add New Room
          </button>
        </div>
      </header>

      <div class="page-content">
        <!-- Filter and Search Toolbar -->
        <div class="room-filter-toolbar">
          <div class="filter-group">
            <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Status:</span>
            <button class="filter-btn status-filter-btn active" data-status="ALL">All Rooms</button>
            <button class="filter-btn status-filter-btn" data-status="Available">Available</button>
            <button class="filter-btn status-filter-btn" data-status="Occupied">Occupied</button>
            <button class="filter-btn status-filter-btn" data-status="Reserved">Reserved</button>
            <button class="filter-btn status-filter-btn" data-status="Cleaning">Cleaning</button>
            <button class="filter-btn status-filter-btn" data-status="Maintenance">Maintenance</button>
          </div>

          <div style="display: flex; gap: 12px; align-items: center;">
            <select id="floorSelect" class="form-control" style="width: 130px; padding: 6px 10px; font-size: 0.8rem;">
              <option value="ALL">All Floors</option>
              <option value="1">Floor 1</option>
              <option value="2">Floor 2</option>
              <option value="3">Floor 3</option>
            </select>

            <div class="search-input-wrap">
              <span class="search-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input type="text" id="roomSearchInput" class="form-control" placeholder="Search room or guest..." style="padding-top: 6px; padding-bottom: 6px; font-size: 0.8rem;">
            </div>

            <span class="badge badge-secondary" id="matchingRoomsCount">0 Rooms</span>
          </div>
        </div>

        <!-- Room Cards Grid -->
        <div class="room-grid" id="roomGridContainer">
          <!-- Populated dynamically via rooms.js -->
        </div>
      </div>
    </main>
  </div>

  <!-- Add Room Modal -->
  <div class="modal-backdrop" id="addRoomModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Add Room to Inventory</h3>
        <button class="modal-close" onclick="closeModal('addRoomModal')">&times;</button>
      </div>
      <form id="newRoomForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="addRoomNo">Room Number *</label>
              <input type="text" id="addRoomNo" class="form-control" placeholder="e.g. 105" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="addRoomType">Room Category *</label>
              <select id="addRoomType" class="form-control" required>
                <option value="Standard">Standard</option>
                <option value="Deluxe" selected>Deluxe</option>
                <option value="Suite">Suite</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="addRoomFloor">Floor *</label>
              <select id="addRoomFloor" class="form-control" required>
                <option value="1">Floor 1</option>
                <option value="2">Floor 2</option>
                <option value="3">Floor 3</option>
                <option value="4">Floor 4</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="addRoomCapacity">Capacity (Guests)</label>
              <input type="number" id="addRoomCapacity" class="form-control" value="2" min="1" max="6">
            </div>

            <div class="form-group">
              <label class="form-label" for="addRoomPrice">Price per Night (₹) *</label>
              <input type="number" id="addRoomPrice" class="form-control" value="4500" min="500" step="100" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="addRoomStatus">Initial Status</label>
              <select id="addRoomStatus" class="form-control">
                <option value="Available" selected>Available</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Maintenance">Maintenance</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="addRoomView">View Type</label>
              <select id="addRoomView" class="form-control">
                <option value="City View" selected>City View</option>
                <option value="Garden View">Garden View</option>
                <option value="Sea View">Sea View</option>
                <option value="Courtyard View">Courtyard View</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="addRoomSmoking">Smoking Policy</label>
              <select id="addRoomSmoking" class="form-control">
                <option value="No" selected>Non-Smoking</option>
                <option value="Yes">Smoking Permitted</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label class="form-label" for="addRoomAmenities">Amenities / Description</label>
              <input type="text" id="addRoomAmenities" class="form-control" placeholder="e.g. King Bed, Garden View, Wi-Fi, Mini Bar">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('addRoomModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save to Inventory</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Room Quick Action / Edit Modal -->
  <div class="modal-backdrop" id="roomActionModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="actionModalRoomNo">Room Details</h3>
        <button class="modal-close" onclick="closeModal('roomActionModal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="hiddenTargetRoomNo">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="actionRoomType" class="form-control">
              <option value="Standard">Standard</option>
              <option value="Deluxe">Deluxe</option>
              <option value="Suite">Suite</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Floor</label>
            <select id="actionRoomFloor" class="form-control">
              <option value="1">Floor 1</option>
              <option value="2">Floor 2</option>
              <option value="3">Floor 3</option>
              <option value="4">Floor 4</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="actionRoomCapacity">Capacity (Guests)</label>
            <input type="number" id="actionRoomCapacity" class="form-control" min="1" max="8">
          </div>

          <div class="form-group">
            <label class="form-label">Tariff / Night (₹)</label>
            <input type="number" id="actionRoomPrice" class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label">Operational Status</label>
            <select id="actionRoomStatus" class="form-control">
              <option value="Available">Available (Vacant Clean)</option>
              <option value="Occupied">Occupied (In-House)</option>
              <option value="Reserved">Reserved (Incoming)</option>
              <option value="Cleaning">Cleaning (Dirty)</option>
              <option value="Maintenance">Out of Order / Maintenance</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="actionRoomView">View Type</label>
            <select id="actionRoomView" class="form-control">
              <option value="City View">City View</option>
              <option value="Garden View">Garden View</option>
              <option value="Sea View">Sea View</option>
              <option value="Courtyard View">Courtyard View</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="actionRoomSmoking">Smoking Policy</label>
            <select id="actionRoomSmoking" class="form-control">
              <option value="No">Non-Smoking</option>
              <option value="Yes">Smoking Permitted</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label class="form-label" for="actionRoomAmenities">Amenities / Description</label>
            <input type="text" id="actionRoomAmenities" class="form-control">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('roomActionModal')">Cancel</button>
        <button type="button" class="btn btn-danger" id="deleteRoomButton" onclick="deleteRoomFromModal()">Delete Room</button>
        <button type="button" class="btn btn-primary" onclick="updateRoomDetailsFromModal()">Update Room Status</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/rooms.js"></script>
</body>
</html>
