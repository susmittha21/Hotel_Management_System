<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooms &amp; Availability | VS PLAZA PMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="pms-layout">
    <!-- Sidebar Navigation -->
    <aside class="pms-sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">VS</div>
        <div class="brand-text">
          <h2>VS PLAZA</h2>
          <span>Property Management</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Front Office</div>
        <a href="dashboard.html" class="nav-item">
          <span class="icon">&#9632;</span>
          <span>Dashboard</span>
        </a>
        <a href="rooms.html" class="nav-item active">
          <span class="icon">&#9632;</span>
          <span>Room Status</span>
        </a>
        <a href="bookings.html" class="nav-item">
          <span class="icon">&#9632;</span>
          <span>Reservations</span>
        </a>
        <a href="guests.html" class="nav-item">
          <span class="icon">&#9632;</span>
          <span>Guest Directory</span>
        </a>
        <a href="invoices.html" class="nav-item">
          <span class="icon">&#9632;</span>
          <span>Invoices</span>
        </a>

      </nav>

      <div class="sidebar-footer">
        <div class="shift-info">
          <div class="user-avatar">FD</div>
          <div class="user-meta">
            <div class="user-name">Front Desk</div>
            <div class="user-role">Morning Shift</div>
          </div>
        </div>
        <button class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="pms-main">
      <header class="pms-topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
          <div class="page-headline">
            <h1>Rooms &amp; Availability</h1>
            <p>Browse the shared room inventory and reserve an available room</p>
          </div>
        </div>
      </header>

      <div class="page-content">
        <!-- Filter and Search Toolbar -->
        <div class="room-filter-toolbar">
          <div class="filter-group">
            <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Status:</span>
            <button class="filter-btn status-filter-btn active" data-status="ALL">All Rooms</button>
            <button class="filter-btn status-filter-btn" data-status="Available">Available</button>
            <button class="filter-btn status-filter-btn" data-status="Occupied">Occupied</button>
            <button class="filter-btn status-filter-btn" data-status="Reserved">Reserved</button>
          </div>

          <div style="display: flex; gap: 12px; align-items: center;">
            <select id="floorSelect" class="form-control" style="width: 130px; padding: 6px 10px; font-size: 0.8rem;">
              <option value="ALL">All Floors</option>
              <option value="1">Floor 1</option>
              <option value="2">Floor 2</option>
              <option value="3">Floor 3</option>
            </select>

            <div class="search-input-wrap">
              <span class="search-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input type="text" id="roomSearchInput" class="form-control" placeholder="Search room or guest..." style="padding-top: 6px; padding-bottom: 6px; font-size: 0.8rem;">
            </div>

            <span class="badge badge-secondary" id="matchingRoomsCount">0 Rooms</span>
          </div>
        </div>

        <!-- Room Cards Grid -->
        <div class="room-grid" id="roomGridContainer">
          <!-- Populated dynamically via rooms.js -->
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/rooms.js"></script>
</body>
</html>
