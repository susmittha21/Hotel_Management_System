<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | VS Plaza PMS</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: #edf2f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 4px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }

    .login-header {
      background: #2c5282;
      color: #ffffff;
      padding: 20px;
      text-align: center;
    }

    .login-logo {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .login-header h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .login-header p {
      font-size: 11px;
      color: #bee3f8;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .login-body {
      padding: 20px;
    }

  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">VS</div>
      <h2>VS Plaza</h2>
      <p>Property Management System</p>
    </div>

    <div class="login-body">
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group" style="margin-bottom: 12px;">
          <label class="form-label" for="loginRole">Login role</label>
          <select id="loginRole" class="form-control" required>
            <option value="Hotel Manager">Hotel Manager</option>
            <option value="Front Desk">Front Desk</option>
            <option value="Operations Staff">Operations Staff</option>
            <option value="Accounts Cashier">Accounts Cashier</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 12px;">
          <label class="form-label" for="loginDbms">Database to use</label>
          <select id="loginDbms" class="form-control" required>
            <option value="postgresql">PostgreSQL</option>
            <option value="mongodb">MongoDB</option>
          </select>
          <small style="display:block;margin-top:5px;color:#718096;">Changes save to PostgreSQL and sync to MongoDB when available.</small>
        </div>

        <div class="form-group" style="margin-bottom: 12px;">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Staff username" required autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 8px;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 14px;">
        <a href="../index.html" style="font-size: 11px; color: #718096;">&larr; Back to Hotel Website</a>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    async function handleLoginSubmit(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('loginRole').value;
      const dbms = document.getElementById('loginDbms').value;
      try {
        const session = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password, role, dbms })
        });
        const authenticatedRole = session.role;
        HotelStore.setAuth({
          loggedIn: true,
          user: session.username,
          role: authenticatedRole,
          dbms: session.dbms
        });
        showToast('Login successful', 'success');
        const startPage = {
          'Hotel Manager': 'dashboard',
          'Front Desk': 'dashboard',
          'Operations Staff': 'housekeeping',
          'Accounts Cashier': 'invoices'
        }[authenticatedRole];
        window.location.href = `${startPage}.html`;
      } catch (error) {
        showToast(error.message, 'error');
      }
    }
  </script>
</body>
</html>
